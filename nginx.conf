# One address for search engines: www answers with a permanent redirect to the
# bare domain, which is the one that is indexed and printed on the resume.
server {
    listen 80;
    server_name www.janmejay.info;
    return 301 https://janmejay.info$request_uri;
}

# Abuse limits (defence in depth behind Cloudflare). Visitors arrive through the
# Cloudflare tunnel and the reverse proxy, so the real client address is in the
# CF-Connecting-IP header. Requests without it (internal health probes) have an
# empty key and are not limited.
limit_req_zone  $http_cf_connecting_ip zone=perip_req:10m  rate=20r/s;
limit_conn_zone $http_cf_connecting_ip zone=perip_conn:10m;

# Every route is a real file in the static build, so unknown paths get a real
# 404 instead of the old SPA catch-all (which returned index.html with a 200 and
# hid the missing resume PDF on 2026-09-20).
server {
    listen 80 default_server;
    server_name janmejay.info _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # A page view is about ten requests; allow bursts of 60, then 429.
    limit_req zone=perip_req burst=60 nodelay;
    limit_req_status 429;
    limit_conn perip_conn 30;
    limit_conn_status 429;

    # The site is read-only and takes no uploads: refuse big bodies, give slow
    # clients little time, and (below) accept only GET and HEAD.
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 20s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml text/plain;

    error_page 404 /404.html;

    # The old /work URL moved to /experience.
    location = /work { return 301 /experience; }
    location = /work/ { return 301 /experience; }

    # Pages of the original static site that search engines still list.
    location = /project.html { return 301 /projects; }
    # Matched on the address the visitor asked for, not on nginx's internal
    # rewrite of "/" to "/index.html" (a plain location would loop).
    if ($request_uri = "/index.html") { return 301 /; }

    # Hashed build output never changes, so browsers may keep it for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
