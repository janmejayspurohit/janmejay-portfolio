# Every route is a real file in the static build, so unknown paths get a real
# 404 instead of the old SPA catch-all (which returned index.html with a 200 and
# hid the missing resume PDF on 2026-09-20).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    error_page 404 /404.html;

    # The old /work URL moved to /experience.
    location = /work { return 301 /experience; }
    location = /work/ { return 301 /experience; }

    # Hashed build output never changes, so browsers may keep it for a year.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
